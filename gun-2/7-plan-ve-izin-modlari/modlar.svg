<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="İzin modları"><defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect x="1" y="1" width="958" height="468" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/><text x="32" y="44" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0F172A" text-anchor="start">İzin modları: ne kadar serbestlik?</text><text x="32" y="68" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Shift+Tab ile değişir; alt satırdaki gösterge o anki modu söyler</text><path d="M60 118 L900 118" stroke="#059669" stroke-width="3" marker-end="url(#ok)"/><text x="60" y="108" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#059669" text-anchor="start">az serbest</text><text x="900" y="108" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#059669" text-anchor="end">çok serbest</text><rect x="40" y="134" width="164" height="104" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="122" y="164" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle">plan</text><text x="122" y="192" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">dosya düzenlemez,</text><text x="122" y="210" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">plan yazar</text><rect x="220" y="134" width="164" height="104" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="302" y="164" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle">default</text><text x="302" y="192" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">her düzenleme ve</text><text x="302" y="210" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">komutta sorar</text><rect x="400" y="134" width="164" height="104" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="482" y="164" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle">acceptEdits</text><text x="482" y="192" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">dosya düzenlemelerini</text><text x="482" y="210" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">sormadan yapar</text><rect x="580" y="134" width="164" height="104" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="662" y="164" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle">auto</text><text x="662" y="192" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">bir sınıflandırıcı</text><text x="662" y="210" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">karar verir</text><rect x="760" y="134" width="164" height="104" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/><text x="842" y="164" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="800" fill="#0F172A" text-anchor="middle">bypassPermissions</text><text x="842" y="192" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">hiç sormaz:</text><text x="842" y="210" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">yalnızca yalıtılmış ortam</text><text x="40" y="272" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="start">Shift+Tab döngüsü:</text><rect x="190" y="254" width="58.4" height="28" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/><text x="219.2" y="273" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">auto</text><line x1="250.4" y1="268" x2="270.4" y2="268" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><rect x="274.4" y="254" width="84.19999999999999" height="28" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/><text x="316.5" y="273" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">default</text><line x1="360.59999999999997" y1="268" x2="380.59999999999997" y2="268" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><rect x="384.59999999999997" y="254" width="118.6" height="28" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/><text x="443.9" y="273" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">acceptEdits</text><line x1="505.19999999999993" y1="268" x2="525.1999999999999" y2="268" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><rect x="529.1999999999999" y="254" width="58.4" height="28" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/><text x="558.4" y="273" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">plan</text><line x1="589.5999999999999" y1="268" x2="609.5999999999999" y2="268" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/><rect x="613.5999999999999" y="254" width="58.4" height="28" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/><text x="642.8" y="273" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="middle">auto</text><text x="701.9999999999999" y="273" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">(bypass açıksa araya girer)</text><rect x="40" y="302" width="430" height="120" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="58" y="328" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="start">İzin kuralları her modda geçerli</text><text x="58" y="354" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">sıra: deny → ask → allow</text><text x="58" y="378" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">allow, bir deny kuralını geçemez</text><text x="58" y="402" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">/permissions ile gör ve ekle</text><rect x="490" y="302" width="430" height="120" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="508" y="328" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="start">Hangi işte hangisi?</text><text x="508" y="354" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">keşif, tasarım, çok dosyalı iş → plan</text><text x="508" y="378" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">planı onaylanmış küçük iş → acceptEdits</text><text x="508" y="402" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">riskli komutlar, yeni repo → default</text><text x="40" y="448" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start" font-style="italic">dontAsk: sorulacak her şeyi reddeder (otomasyon, CI). Döngüde yer almaz.</text></svg>
